<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NamelyzeEcom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        .checkout-card {
            border: 1px solid #eee;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-bg);
        }

        .shipping-option {
            border: 2px solid #eee;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .shipping-option.active {
            border-color: var(--primary-color);
            background: rgba(254, 82, 0, 0.05);
        }
    </style>
</head>

<body class="bg-light">
    <!-- Simple Header -->
    <header class="bg-white py-3 border-bottom shadow-sm mb-4">
        <div class="container text-center">
            <a href="index.html">
                <img src="https://clicktoshopbd.com/uploads/settings/logo.png" alt="NamelyzeEcom" height="45">
            </a>
        </div>
    </header>

    <main class="container mb-5">
        <div class="row g-4">
            <!-- Form -->
            <div class="col-lg-7">
                <div class="bg-white p-4 checkout-card">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">অর্ডারটি কনফার্ম করতে আপনার তথ্য দিন</h5>
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label">আপনার নাম লিখুন *</label>
                            <input type="text" class="form-control form-control-lg" name="customerName"
                                placeholder="উদা: আব্দুল করিম" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">আপনার মোবাইল নাম্বার লিখুন *</label>
                            <input type="tel" class="form-control form-control-lg" name="customerPhone"
                                placeholder="উদা: 01xxxxxxxxx" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">আপনার ঠিকানা লিখুন *</label>
                            <textarea class="form-control form-control-lg" name="deliveryAddress" rows="2"
                                placeholder="উদা: মিরপুর, ঢাকা" required></textarea>
                        </div>

                        <label class="form-label mb-3">ডেলিভারি এরিয়া নিবার্চন করুন *</label>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="shipping-option active" data-cost="70" data-area="Inside Dhaka">
                                    <input type="radio" name="shippingArea" value="Inside Dhaka" checked class="d-none">
                                    <div class="fw-bold">ঢাকার ভিতরে</div>
                                    <div class="text-orange fw-bold">৳ ৭০.০০</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="shipping-option" data-cost="100" data-area="Outside Dhaka">
                                    <input type="radio" name="shippingArea" value="Outside Dhaka" class="d-none">
                                    <div class="fw-bold">ঢাকার বাইরে</div>
                                    <div class="text-orange fw-bold">৳ ১০০.০০</div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <label class="form-label">পেমেন্ট মেথড</label>
                            <div class="p-3 bg-light border rounded">
                                <i class="fas fa-money-bill-wave text-success"></i> Cash on Delivery (ক্যাশ অন ডেলিভারি)
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Summary -->
            <div class="col-lg-5">
                <div class="bg-white p-4 checkout-card sticky-top" style="top: 100px;">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">আপনার অর্ডার</h5>
                    <div id="productSummary" class="mb-4">
                        <div class="text-center py-4">
                            <div class="spinner-border text-orange" role="status"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>পণ্যর দাম</span>
                        <span class="fw-bold" id="subtotal">৳ ০</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>ডেলিভারি চার্জ</span>
                        <span class="fw-bold" id="shippingDisplay">৳ ৭০</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="h5 fw-bold">সর্বমোট</span>
                        <span class="h5 fw-bold text-orange" id="grandTotal">৳ ০</span>
                    </div>

                    <button type="submit" form="checkoutForm" class="btn btn-order btn-lg py-3 w-100">অর্ডার কনফার্ম
                        করুন</button>

                    <div class="mt-4 text-center">
                        <p class="small text-muted"><i class="fas fa-shield-alt"></i> ১০০% নিরাপদ পেমেন্ট গেটওয়ে</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/js/site.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        $(document).ready(function () {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('productId');
            let productPrice = 0;
            let shippingCost = 70;

            // Load product data
            if (productId) {
                NamelyzeEcom.ajax(`/products/${productId}`, 'GET', null, function (product) {
                    productPrice = product.salePrice;
                    $('#productSummary').html(`
                        <div class="d-flex align-items-center gap-3">
                            <img src="${product.imageUrl || 'https://placehold.co/80'}" width="80" class="rounded">
                            <div>
                                <h6 class="fw-bold mb-1">${product.name}</h6>
                                <div class="text-orange fw-bold">${NamelyzeEcom.formatCurrency(product.salePrice)}</div>
                            </div>
                        </div>
                    `);
                    updateTotals();
                });
            }

            // Shipping selection logic
            $('.shipping-option').click(function () {
                $('.shipping-option').removeClass('active');
                $(this).addClass('active');
                $(this).find('input').prop('checked', true);
                shippingCost = parseInt($(this).data('cost'));
                updateTotals();
            });

            function updateTotals() {
                $('#subtotal').text(NamelyzeEcom.formatCurrency(productPrice));
                $('#shippingDisplay').text(NamelyzeEcom.formatCurrency(shippingCost));
                $('#grandTotal').text(NamelyzeEcom.formatCurrency(productPrice + shippingCost));
            }

            // Form Submit
            $('#checkoutForm').submit(function (e) {
                e.preventDefault();
                Swal.fire({
                    title: 'অর্ডারটি সফল হয়েছে!',
                    text: 'আমাদের একজন প্রতিনিধি আপনাকে কল দিয়ে অর্ডারটি কনফার্ম করবে।',
                    icon: 'success',
                    confirmButtonText: 'ঠিক আছে',
                    confirmButtonColor: '#FE5200'
                }).then(() => {
                    window.location.href = '/index.html';
                });
            });
        });
    </script>
</body>

</html>
