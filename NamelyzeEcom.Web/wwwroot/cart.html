<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NamelyzeEcom</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/site.css">
</head>

<body>
    <header class="navbar-custom sticky-top">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand fw-bold text-primary" href="/">NamelyzeEcom</a>
            </div>
        </nav>
    </header>

    <main class="container mt-5">
        <h2 class="fw-bold mb-4">Your Shopping Cart</h2>
        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card premium-card overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="cartTable">
                            <thead class="bg-light">
                                <tr>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Subtotal</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Temporary static mockup for demonstration, will be dynamic logic later -->
                                <tr>
                                    <td>
                                        <div class="d-flex align-items-center">
                                            <img src="https://placehold.co/50x50" class="rounded-2 me-3" alt="Product">
                                            <div>
                                                <div class="fw-bold">Premium Wireless Headphones</div>
                                                <small class="text-muted">Color: Black</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td>৳5,500</td>
                                    <td style="width: 150px;">
                                        <div class="input-group input-group-sm">
                                            <button class="btn btn-outline-secondary" type="button">-</button>
                                            <input type="number" class="form-control text-center" value="1">
                                            <button class="btn btn-outline-secondary" type="button">+</button>
                                        </div>
                                    </td>
                                    <td class="fw-bold">৳5,500</td>
                                    <td><button class="btn btn-link text-danger p-0"><i
                                                class="fas fa-trash"></i></button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-4">
                    <a href="/" class="btn btn-outline-primary rounded-pill"><i class="fas fa-arrow-left me-2"></i>
                        Continue Shopping</a>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card premium-card p-4">
                    <h5 class="fw-bold mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span class="fw-bold">৳5,500</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping</span>
                        <span class="text-success">Free</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="h5 fw-bold">Total</span>
                        <span class="h5 fw-bold text-primary">৳5,500</span>
                    </div>
                    <div class="mb-4">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Coupon Code">
                            <button class="btn btn-outline-primary" type="button">Apply</button>
                        </div>
                    </div>
                    <a href="/checkout.html" class="btn btn-premium w-100 py-3">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/site.js"></script>
</body>

</html>
